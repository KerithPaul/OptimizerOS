# ArchitectOS Phase 1 — datastore Compose (checkpoint 1.A).
# Datastores only. API, worker, and Next.js run on the host (P10).
# Qdrant and Neo4j stay idle until Phase 2 application code (C4).
# Local credential defaults match §4 names; override via `.env` in step 1.A.2.

name: architectos

services:
  mysql:
    image: mysql:8.4
    container_name: architectos-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-architectos}
      MYSQL_USER: ${MYSQL_USER:-architectos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-architectos_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-architectos_dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-buffer-pool-instances=1
      - --max-connections=50
      - --performance-schema=OFF
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-architectos_dev}", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: architectos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    mem_limit: 300m
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: architectos-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:6333/readyz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5.26-community
    container_name: architectos-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-architectos_dev}
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
    volumes:
      - neo4j_data:/data
    mem_limit: 3g
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-architectos_dev}", "RETURN 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  neo4j_data:
