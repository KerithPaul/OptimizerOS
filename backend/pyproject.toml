[project]
name = "architectos-backend"
version = "0.1.0"
description = "ArchitectOS backend API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymysql>=1.1",
    "redis>=5.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-css>=0.25.0",
    "neo4j>=6.3.0",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "groq>=1.7.0",
    "httpx>=0.28",
    "selectolax>=0.3",
    "playwright>=1.49",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Phase 5.D harness is named rag_eval.py (plan path), not test_*.py.
python_files = ["test_*.py", "rag_eval.py"]
